plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gladimdim.omarchy.watchface'
    compileSdk 34

    defaultConfig {
        applicationId "com.gladimdim.omarchy.watchface"
        minSdk 34
        targetSdk 35
        versionCode 3
        versionName "1.0.2"
    }

    signingConfigs {
        release {
            storeFile file("../release.keystore")
            storePassword "omarchy_release_key_2026"
            keyAlias "omarchy"
            keyPassword "omarchy_release_key_2026"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }
}

afterEvaluate {
    tasks.register('finalizeWatchFaceBundle') {
        dependsOn 'signReleaseBundle'
        doLast {
            def aabFile = file("build/outputs/bundle/release/app-release.aab")
            if (aabFile.exists()) {
                exec {
                    commandLine 'zip', '-d', aabFile.absolutePath, 'base/dex/*'
                    ignoreExitValue = true
                }
                exec {
                    commandLine 'zip', '-d', aabFile.absolutePath, 'META-INF/*'
                    ignoreExitValue = true
                }
                exec {
                    commandLine 'jarsigner',
                        '-keystore', file('../release.keystore').absolutePath,
                        '-storepass', 'omarchy_release_key_2026',
                        '-keypass', 'omarchy_release_key_2026',
                        aabFile.absolutePath,
                        'omarchy'
                }
                println "Successfully finalized Watch Face Format AAB (removed dex files and re-signed)."
            }
        }
    }

    tasks.named('bundleRelease').configure {
        finalizedBy 'finalizeWatchFaceBundle'
    }
}
